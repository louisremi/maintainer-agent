name: CI

# PRs: lint + tests + amd64 image builds and smoke tests.
# main and v* tags: build amd64 + arm64 on native runners and publish
#   docker.io/louisremi/maintainer-agent:{latest | vX.Y.Z}, sha-<short>         (runner)
#   docker.io/louisremi/maintainer-agent-server:{latest | vX.Y.Z}, sha-<short>  (server)

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install server dependencies
        working-directory: server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install linters
        env:
          HADOLINT_VERSION: 2.15.1
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends shellcheck
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          curl -fsSL "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/checksums.sha256" \
            | awk '$2 == "*hadolint-linux-x86_64" {print $1"  hadolint"}' | sha256sum --check --strict -
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            | awk -v f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" '$2 == f {print $1"  actionlint.tgz"}' | sha256sum --check --strict -
          tar -xzf actionlint.tgz actionlint
          sudo install -m 0755 hadolint actionlint /usr/local/bin/
      - name: Lint and test
        run: tests/run.sh

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        component: [runner, server]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: runner
            image: maintainer-agent
          - component: server
            image: maintainer-agent-server
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      IMAGE: docker.io/louisremi/${{ matrix.image }}
    steps:
      - name: Skip arm64 on pull requests
        if: matrix.arch == 'arm64' && github.event_name == 'pull_request'
        run: echo "arm64 is built on main and tags only"
      - uses: actions/checkout@v7
        if: matrix.arch == 'amd64' || github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v4
        if: matrix.arch == 'amd64' || github.event_name != 'pull_request'
      - name: Build (load for smoke test)
        if: matrix.arch == 'amd64' || github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: AGENT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }},mode=max
      - name: Smoke test
        if: matrix.arch == 'amd64' || github.event_name != 'pull_request'
        run: |
          if [[ "${{ matrix.component }}" == runner ]]; then
            tests/smoke-image.sh "${{ matrix.image }}:ci"
          else
            tests/smoke-server.sh "${{ matrix.image }}:ci"
          fi
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/${{ matrix.arch }}
          build-args: AGENT_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p out
          echo "${{ steps.push.outputs.digest }}" > "out/digest-${{ matrix.component }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: out/
          retention-days: 7

  publish:
    needs: image
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - component: runner
            image: maintainer-agent
          - component: server
            image: maintainer-agent-server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: docker.io/louisremi/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.component }}-*
          path: artifacts
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:sha-${SHA:0:12}")
          if [[ "${REF_TYPE}" == tag ]]; then tags+=(--tag "${IMAGE}:${REF_NAME}"); else tags+=(--tag "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}@$(cat "artifacts/digest-${COMPONENT}-amd64")" "${IMAGE}@$(cat "artifacts/digest-${COMPONENT}-arm64")"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHA:0:12}"
