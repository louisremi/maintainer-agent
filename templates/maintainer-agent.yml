# .maintainer-agent.yml (or .github/maintainer-agent.yml): how maintainer-agent
# behaves in this repository. Everything is optional, and so is the file:
# installing the app is enough. The server operator's settings.yml decides
# what is allowed; this file can only narrow it (switch features off, lower
# limits, require the agent-fix label, add checks, links and protected paths;
# add egress hosts if the operator allows it). Keys you leave out keep the
# operator's values. The file is read from the default branch and
# validated strictly (unknown keys are errors). It is protected: the agent
# never modifies it.
version: 2

# Files the agent reads first. Default: the first of AGENTS.md,
# CONTRIBUTING.md, README.md that exists.
instructions: [AGENTS.md]

# Repository-specific playbooks, overriding the generic ones shipped with the
# agent (issue: classify and answer; implement: propose a change; review:
# review a change request).
playbooks:
  issue: docs/agent/issue.md
  implement: docs/agent/implement.md
  review: docs/agent/review.md

# Commands the fix agent runs to verify a change.
checks:
  - make test

# Extra hosts the fix agent may reach (package registries, release
# downloads...). The model endpoint is always allowed. The issue and review
# agents never get network access beyond the model.
egress:
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org

# Extra https URL prefixes allowed as links in posted text. Links to this
# repository are always allowed; every other link is turned into plain text.
links:
  - https://example.com/docs/

# Paths a proposed change must never touch, in addition to the forge's
# automation files (.github/** on GitHub) and the policy files.
protected_paths:
  - LICENSE

# A first answer on every new issue.
answer:
  enabled: true
  max_attempts: 2      # agent runs before giving up (capped by the server)

# Draft change requests for bug reports and feature requests.
fix:
  enabled: true
  # maintainers: automatically for issues opened by maintainers, after the
  #   `agent-fix` label (added by a maintainer) for everyone else;
  # label: only after a maintainer adds `agent-fix`.
  trigger: maintainers
  max_attempts: 2
  step_limit: 80       # capped by the server's MAX_STEP_LIMIT

# One comment-only review on every new, non-draft change request (not on the
# agent's own drafts; a maintainer adds `agent-rereview` for another review).
review:
  enabled: true
  max_comments: 20
  max_diff_lines: 5000         # larger changes get a summary only
  max_attempts: 2
